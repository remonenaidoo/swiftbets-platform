name: swiftbets

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Development
    Kafka__BootstrapServers: redpanda:9092
    Kafka__Environment: ${SWIFTBETS_ENV:-dev}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    FaultInjection__Enabled: "false"
  networks: [swiftbets]
  mem_limit: 384m
  cpus: 1.0
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]

x-migrator: &migrator
  restart: "no"
  networks: [swiftbets]
  mem_limit: 256m
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]

x-healthcheck: &dotnet-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:7192
    ports: ["127.0.0.1:7192:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    networks: [swiftbets]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.18
    entrypoint: ["/bin/bash", "/topics/provision-topics.sh", "/topics/topics.yaml"]
    environment:
      SWIFTBETS_ENV: ${SWIFTBETS_ENV:-dev}
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_ADMIN: redpanda:9644
    volumes: ["./redpanda:/topics:ro"]
    networks: [swiftbets]
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["127.0.0.1:7180:8080"]
    networks: [swiftbets]
    mem_limit: 256m
    depends_on:
      redpanda: { condition: service_healthy }

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports: ["127.0.0.1:7133:1433"]
    volumes: [sqlserver:/var/opt/mssql]
    networks: [swiftbets]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    platform: linux/amd64
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - sqlserver
      - -U
      - sa
      - -b
      - -i
      - /init/init.sql
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      PLACEMENT_DB_PASSWORD: ${PLACEMENT_DB_PASSWORD}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD}
      PAYOUT_DB_PASSWORD: ${PAYOUT_DB_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      COMPLIANCE_DB_PASSWORD: ${COMPLIANCE_DB_PASSWORD}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    volumes: ["./sqlserver:/init:ro"]
    networks: [swiftbets]
    depends_on:
      sqlserver: { condition: service_healthy }
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      STEWARD_DB_PASSWORD: ${STEWARD_DB_PASSWORD}
      HISTORY_DB_PASSWORD: ${HISTORY_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      CONFIG_DB_PASSWORD: ${CONFIG_DB_PASSWORD}
    ports: ["127.0.0.1:7134:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    networks: [swiftbets]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sb_steward"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:7135:6379"]
    volumes: [redis:/data]
    networks: [swiftbets]
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    networks: [swiftbets]
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:7190:9090"]
    networks: [swiftbets]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:7130:3000"]
    networks: [swiftbets]
    mem_limit: 384m
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  placement-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-placement-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-placement, dockerfile: deploy/SwiftBets.Placement.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbPlacement: Server=sqlserver,1433;Database=SbPlacement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: placement_app
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  identity-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-identity-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-identity, dockerfile: deploy/SwiftBets.Identity.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbIdentity: Server=sqlserver,1433;Database=SbIdentity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: identity_app
      # Moves accounts and live devices from placement's identity module; repeat runs leave existing rows alone.
      Migrator__ImportFromPlacement: Server=sqlserver,1433;Database=SbPlacement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      placement-migrator: { condition: service_completed_successfully }

  identity:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-identity:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-identity, dockerfile: deploy/SwiftBets.Identity.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbIdentity: Server=sqlserver,1433;Database=SbIdentity;User Id=identity_app;Password=${IDENTITY_DB_PASSWORD};TrustServerCertificate=True
      Identity__Issuer: http://identity:8080
      Identity__SigningKeyPem: ${IDENTITY_SIGNING_KEY_PEM:-}
      Identity__SeedDemoUsers: "true"
      Identity__DemoPassword: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      Identity__LoadTestUserCount: ${LOAD_TEST_USERS:-100}
      Identity__Clients__payout: ${PAYOUT_CLIENT_SECRET:?set PAYOUT_CLIENT_SECRET in .env}
      Identity__Clients__steward: ${STEWARD_CLIENT_SECRET:?set STEWARD_CLIENT_SECRET in .env}
      Identity__Clients__payments: ${PAYMENTS_CLIENT_SECRET:?set PAYMENTS_CLIENT_SECRET in .env}
      Kafka__ClientId: swiftbets-identity
      AccountEmail__Delivery: Notifications
      AccountEmail__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://127.0.0.1:7100}
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Identity.Api.dll", "--healthcheck"] }
    depends_on:
      identity-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  compliance-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-compliance-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-compliance, dockerfile: deploy/SwiftBets.Compliance.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbCompliance: Server=sqlserver,1433;Database=SbCompliance;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: compliance_app
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  # Limits, exclusions and session settings; the wallet, identity and gateway enforce what it publishes (ADR 0006).
  compliance:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-compliance:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-compliance, dockerfile: deploy/SwiftBets.Compliance.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbCompliance: Server=sqlserver,1433;Database=SbCompliance;User Id=compliance_app;Password=${COMPLIANCE_DB_PASSWORD};TrustServerCertificate=True
      Kafka__ClientId: swiftbets-compliance
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Compliance.Api.dll", "--healthcheck"] }
    depends_on:
      compliance-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  payments-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-payments-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-payments, dockerfile: deploy/SwiftBets.Payments.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbPayments: Server=sqlserver,1433;Database=SbPayments;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: payments_app
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  # Deposits and withdrawals through a provider port; the simulator below stands in for a real provider in dev.
  payments:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-payments:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-payments, dockerfile: deploy/SwiftBets.Payments.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbPayments: Server=sqlserver,1433;Database=SbPayments;User Id=payments_app;Password=${PAYMENTS_DB_PASSWORD};TrustServerCertificate=True
      Kafka__ClientId: swiftbets-payments
      Wallet__GrpcAddress: http://wallet:8081
      ServiceIdentity__TokenEndpoint: http://identity:8080/auth/token
      ServiceIdentity__ClientId: payments
      ServiceIdentity__ClientSecret: ${PAYMENTS_CLIENT_SECRET}
      Payments__ReturnUrl: http://127.0.0.1:7100/account/wallet
      Payments__Simulator__BaseUrl: http://payments-simulator:8080
      Payments__Simulator__ApiKey: ${PAYMENTS_SIMULATOR_API_KEY}
      Payments__Simulator__WebhookSecrets__0: ${PAYMENTS_WEBHOOK_SECRET}
      # Paystack test mode for deposits: set PAYMENTS_DEPOSIT_PROVIDER=paystack and a test secret key.
      Payments__DepositProvider: ${PAYMENTS_DEPOSIT_PROVIDER:-simulator}
      Payments__Paystack__SecretKey: ${PAYSTACK_TEST_SECRET_KEY:-}
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Payments.Api.dll", "--healthcheck"] }
    depends_on:
      payments-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  # The simulated provider: checkout pages at http://127.0.0.1:7140, signed webhooks back to payments.
  payments-simulator:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-payments-simulator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-payments, dockerfile: deploy/SwiftBets.Payments.Simulator.Dockerfile }
    environment:
      <<: *dotnet-env
      Simulator__ApiKey: ${PAYMENTS_SIMULATOR_API_KEY}
      Simulator__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET}
      Simulator__WebhookUrl: http://payments:8080/webhooks/simulator
      Simulator__PublicUrl: http://127.0.0.1:7140
    ports: ["127.0.0.1:7140:8080"]
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Payments.Simulator.dll", "--healthcheck"] }

  # Catches every account email in dev; the inbox is at http://127.0.0.1:7125.
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:7125:8025"]
    networks: [swiftbets]
    mem_limit: 64m
    restart: unless-stopped

  wallet-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-wallet-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-wallet, dockerfile: deploy/SwiftBets.Wallet.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbWallet: Server=sqlserver,1433;Database=SbWallet;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: wallet_app
      Migrator__SeedDemo: "true"
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  settlement-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-settlement-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-settlement, dockerfile: deploy/SwiftBets.Settlement.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbSettlement: Server=sqlserver,1433;Database=SbSettlement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: settlement_app
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  payout-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-payout-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-payout, dockerfile: deploy/SwiftBets.Payout.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbPayout: Server=sqlserver,1433;Database=SbPayout;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Migrator__EnsureDatabase: "true"
      Migrator__AppLogin: payout_app
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }

  steward-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-steward-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-steward, dockerfile: deploy/SwiftBets.Steward.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbSteward: Host=postgres;Database=sb_steward;Username=steward_app;Password=${STEWARD_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  history-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-history-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-placement, dockerfile: deploy/SwiftBets.History.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbHistory: Host=postgres;Database=sb_history;Username=history_app;Password=${HISTORY_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  notifications-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-notifications-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-notifications, dockerfile: deploy/SwiftBets.Notifications.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbNotifications: Host=postgres;Database=sb_notifications;Username=notifications_app;Password=${NOTIFICATIONS_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  config-migrator:
    <<: *migrator
    image: ghcr.io/remonenaidoo/swiftbets-config-migrator:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-config, dockerfile: deploy/SwiftBets.Config.Migrator.Dockerfile }
    environment:
      ConnectionStrings__SbConfig: Host=postgres;Database=sb_config;Username=config_app;Password=${CONFIG_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  # Kill switch, placement mode, live delays, limits and flags, published on a compacted topic.
  config:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-config:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-config, dockerfile: deploy/SwiftBets.Config.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-config
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbConfig: Host=postgres;Database=sb_config;Username=config_app;Password=${CONFIG_DB_PASSWORD}
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Config.Api.dll", "--healthcheck"] }
    depends_on:
      config-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  # Sends every customer email from NotificationRequestedV1; Mailpit catches it in dev.
  notifications:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-notifications:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-notifications, dockerfile: deploy/SwiftBets.Notifications.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-notifications
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbNotifications: Host=postgres;Database=sb_notifications;Username=notifications_app;Password=${NOTIFICATIONS_DB_PASSWORD}
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Notifications.Api.dll", "--healthcheck"] }
    depends_on:
      notifications-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  offer:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-offer:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-offer, dockerfile: deploy/SwiftBets.Offer.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-offer
      # Human pace for the preview: one kickoff a minute, each match listed 20 minutes ahead. Load tests can
      # compress it (REPLAY_SLOT_SECONDS=10) for throughput.
      Replay__SlotSeconds: ${REPLAY_SLOT_SECONDS:-60}
      Replay__ListLeadSlots: ${REPLAY_LIST_LEAD_SLOTS:-20}
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__Redis: redis:6379
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Offer.Api.dll", "--healthcheck"] }
    depends_on:
      topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  placement:
    <<: *dotnet-service
    cpus: 2.0
    mem_limit: 512m
    image: ghcr.io/remonenaidoo/swiftbets-placement:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-placement, dockerfile: deploy/SwiftBets.Placement.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-placement
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      Identity__Issuer: http://placement:8080
      Identity__SigningKeyPem: ${IDENTITY_SIGNING_KEY_PEM:-}
      Identity__SeedDemoUsers: "true"
      Identity__DemoPassword: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      Identity__LoadTestUserCount: ${LOAD_TEST_USERS:-100}
      Identity__Clients__payout: ${PAYOUT_CLIENT_SECRET:?set PAYOUT_CLIENT_SECRET in .env}
      Identity__Clients__steward: ${STEWARD_CLIENT_SECRET:?set STEWARD_CLIENT_SECRET in .env}
      Identity__Clients__payments: ${PAYMENTS_CLIENT_SECRET:?set PAYMENTS_CLIENT_SECRET in .env}
      Wallet__GrpcAddress: http://wallet:8081
      ConnectionStrings__SbPlacement: Server=sqlserver,1433;Database=SbPlacement;User Id=placement_app;Password=${PLACEMENT_DB_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__SbHistory: Host=postgres;Database=sb_history;Username=history_app;Password=${HISTORY_DB_PASSWORD}
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Placement.Api.dll", "--healthcheck"] }
    depends_on:
      placement-migrator: { condition: service_completed_successfully }
      history-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  wallet:
    <<: *dotnet-service
    cpus: 2.0
    mem_limit: 512m
    image: ghcr.io/remonenaidoo/swiftbets-wallet:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-wallet, dockerfile: deploy/SwiftBets.Wallet.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-wallet
      FaultInjection__Enabled: "true"
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbWallet: Server=sqlserver,1433;Database=SbWallet;User Id=wallet_app;Password=${WALLET_DB_PASSWORD};TrustServerCertificate=True
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Wallet.Api.dll", "--healthcheck"] }
    depends_on:
      wallet-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  settlement:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-settlement:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-settlement, dockerfile: deploy/SwiftBets.Settlement.Worker.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-settlement
      FaultInjection__Enabled: "true"
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__SbSettlement: Server=sqlserver,1433;Database=SbSettlement;User Id=settlement_app;Password=${SETTLEMENT_DB_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Settlement.Worker.dll", "--healthcheck"] }
    depends_on:
      settlement-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  payout:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-payout:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-payout, dockerfile: deploy/SwiftBets.Payout.Worker.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-payout
      FaultInjection__Enabled: "true"
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      Wallet__GrpcAddress: http://wallet:8081
      ServiceIdentity__TokenEndpoint: http://identity:8080/auth/token
      ServiceIdentity__ClientId: payout
      ServiceIdentity__ClientSecret: ${PAYOUT_CLIENT_SECRET}
      ConnectionStrings__SbPayout: Server=sqlserver,1433;Database=SbPayout;User Id=payout_app;Password=${PAYOUT_DB_PASSWORD};TrustServerCertificate=True
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Payout.Worker.dll", "--healthcheck"] }
    depends_on:
      payout-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  steward:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-steward:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-steward, dockerfile: deploy/SwiftBets.Steward.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-steward
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
      ServiceIdentity__TokenEndpoint: http://identity:8080/auth/token
      ServiceIdentity__ClientId: steward
      ServiceIdentity__ClientSecret: ${STEWARD_CLIENT_SECRET}
      Platform__SettlementAddress: http://settlement:8080
      Platform__PayoutAddress: http://payout:8080
      Platform__OfferAddress: http://offer:8080
      Platform__WalletAddress: http://wallet:8080
      Platform__PrometheusAddress: http://prometheus:9090
      Steward__ModelProvider__Provider: ${STEWARD_MODEL_PROVIDER:-replay}
      Steward__ModelProvider__ReplayDirectory: /app/transcripts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Steward__Embeddings__Provider: ${STEWARD_EMBEDDINGS:-ollama}
      Steward__Embeddings__OllamaAddress: ${OLLAMA_ADDRESS:-http://host.docker.internal:11434}
      ConnectionStrings__SbSteward: Host=postgres;Database=sb_steward;Username=steward_app;Password=${STEWARD_DB_PASSWORD}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:7106:8080"]
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Steward.Api.dll", "--healthcheck"] }
    depends_on:
      steward-migrator: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }

  realtime:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-realtime:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-realtime, dockerfile: deploy/SwiftBets.Realtime.Api.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-realtime
      ConnectionStrings__Redis: redis:6379
      Jwt__Authority: http://identity:8080
      Jwt__RequireHttpsMetadata: "false"
    ports: ["127.0.0.1:7107:8080"]
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Realtime.Api.dll", "--healthcheck"] }
    depends_on:
      topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  risk:
    <<: *dotnet-service
    image: ghcr.io/remonenaidoo/swiftbets-risk:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-risk, dockerfile: deploy/SwiftBets.Risk.Worker.Dockerfile }
    environment:
      <<: *dotnet-env
      Kafka__ClientId: swiftbets-risk
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Risk.Worker.dll", "--healthcheck"] }
    depends_on:
      topics: { condition: service_completed_successfully }

  gateway:
    <<: *dotnet-service
    cpus: 2.0
    mem_limit: 512m
    image: ghcr.io/remonenaidoo/swiftbets-gateway:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-gateway, dockerfile: deploy/SwiftBets.Gateway.Api.Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      FaultInjection__Enabled: "false"
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: redpanda:9092
      Kafka__Environment: ${SWIFTBETS_ENV:-dev}
      Kafka__ClientId: swiftbets-gateway
      Gateway__IdentityAddress: http://identity:8080
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080
      ReverseProxy__Clusters__compliance__Destinations__primary__Address: http://compliance:8080
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments:8080
      # Open preview: sign visitors in as this demo account automatically. Off when empty.
      Gateway__DemoSignIn__Username: ${GATEWAY_DEMO_SIGN_IN_USER:-}
      Gateway__DemoSignIn__PunterUsername: ${GATEWAY_DEMO_SIGN_IN_PUNTER:-}
      Gateway__DemoSignIn__Password: ${GATEWAY_DEMO_SIGN_IN_PASSWORD:-}
      Gateway__RateLimits__LoginPerMinute: ${GATEWAY_LOGIN_PER_MINUTE:-600}
      Gateway__RateLimits__PlacementsPerUserPerMinute: ${GATEWAY_PLACEMENTS_PER_USER_PER_MINUTE:-20000}
      Gateway__RateLimits__RequestsPerIpPerMinute: ${GATEWAY_REQUESTS_PER_IP_PER_MINUTE:-200000}
    # The second port is for a reverse proxy on the host (e.g. a public preview): set GATEWAY_EDGE_BIND=172.17.0.1.
    ports: ["127.0.0.1:7100:8080", "${GATEWAY_EDGE_BIND:-127.0.0.1}:${GATEWAY_EDGE_PORT:-7101}:8080"]
    healthcheck: { <<: *dotnet-healthcheck, test: ["CMD", "dotnet", "/app/SwiftBets.Gateway.Api.dll", "--healthcheck"] }
    depends_on:
      redis: { condition: service_healthy }
      topics: { condition: service_completed_successfully }

  web:
    image: ghcr.io/remonenaidoo/swiftbets-web:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-mobile, dockerfile: Dockerfile }
    ports: ["127.0.0.1:7111:8080"]
    networks: [swiftbets]
    mem_limit: 64m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 10s, timeout: 3s, retries: 5 }

  # The server-rendered customer site; the gateway sends /account here and everything else to web for now.
  site:
    image: ghcr.io/remonenaidoo/swiftbets-site:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-web }
    environment:
      GATEWAY_URL: http://gateway:8080
      CHECKOUT_ORIGINS: http://127.0.0.1:7140
    ports: ["127.0.0.1:7113:8080"]
    networks: [swiftbets]
    mem_limit: 192m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 10s, timeout: 3s, retries: 5 }

  dashboard:
    image: ghcr.io/remonenaidoo/swiftbets-dashboard:${SWIFTBETS_TAG:-local}
    build: { context: ../../swiftbets-dashboard }
    ports: ["127.0.0.1:7110:8080"]
    networks: [swiftbets]
    mem_limit: 64m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  swiftbets:
    name: swiftbets

volumes:
  redpanda:
  sqlserver:
  postgres:
  redis:
  tempo:
  prometheus:
  grafana:
