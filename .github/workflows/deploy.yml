name: deploy

# Deploys a released version to production through the protected `prod` environment, which requires an approval.
# Production is defined but not running yet (D91): until the environment has a KUBECONFIG secret the job only
# reports that it skipped. Production runs released images only, so the tag must be a semver release.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Released image tag every service runs (x.y.z)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
    steps:
      - name: Cluster configured?
        id: cluster
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::notice::No KUBECONFIG secret on the prod environment yet; production is defined but not deployed (D91)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.cluster.outputs.ready == 'true'
      - uses: azure/setup-helm@v4
        if: steps.cluster.outputs.ready == 'true'
      - name: Deploy
        if: steps.cluster.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::image_tag must be a released x.y.z"; exit 1; }
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          scripts/helm-deps.sh
          helm upgrade --install swiftbets charts/swiftbets -n swiftbets \
            -f charts/swiftbets/values-prod.yaml --reuse-values \
            --set global.imageTag="$IMAGE_TAG" --wait --timeout 20m
          kubectl -n swiftbets rollout status deployment --timeout 10m
