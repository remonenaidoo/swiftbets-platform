name: dotnet

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON array of {"name","dockerfile"} images to build from the repository root'
        type: string
        default: '[]'
      coverage:
        description: Collect coverage; every test project must reference Microsoft.Testing.Extensions.CodeCoverage
        type: boolean
        default: false
      coverage-floors:
        description: 'JSON object of assembly name to {"line": pct, "branch": pct} minimums'
        type: string
        default: '{}'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: remonenaidoo/swiftbets-platform
          path: .platform
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fetch shared packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .platform/scripts/fetch-shared-packages.sh .
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
        if: ${{ !inputs.coverage }}
      - run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura
        if: inputs.coverage
      - name: Coverage
        if: inputs.coverage
        env:
          FLOORS: ${{ inputs.coverage-floors }}
        run: |
          mapfile -t reports < <(find . -path '*/TestResults/*.cobertura.xml' -not -path './.platform/*')
          python3 .platform/scripts/check-coverage.py "$FLOORS" "${reports[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qE '^\s+> ' vulnerable.txt

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  images:
    if: inputs.images != '[]'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: remonenaidoo/swiftbets-platform
          path: .platform
      - name: Fetch shared packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .platform/scripts/fetch-shared-packages.sh .
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.authors=Remone Naidoo
      - name: Build for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.image.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .platform/security/.trivyignore
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push multi-arch
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
