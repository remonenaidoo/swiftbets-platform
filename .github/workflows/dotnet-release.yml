name: dotnet-release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: remonenaidoo/swiftbets-platform
          path: .platform
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fetch shared packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .platform/scripts/fetch-shared-packages.sh .
      - run: dotnet pack -c Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  release:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
