name: dotnet-release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v; empty takes it from the pushed tag
        type: string
        default: ''

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: remonenaidoo/swiftbets-platform
          path: .platform
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fetch shared packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .platform/scripts/fetch-shared-packages.sh .
      - env:
          VERSION: ${{ inputs.version }}
        run: dotnet pack -c Release -o artifacts -p:Version="${VERSION:-${GITHUB_REF_NAME#v}}"
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  release:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts
      # A dispatched release creates its tag on the built commit; a pushed tag already has one.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION:-${GITHUB_REF_NAME#v}}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          gh release upload "$tag" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
