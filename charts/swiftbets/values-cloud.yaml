# The OCI Always Free ARM k3s cluster (D31). No SQL Server StatefulSet: the betstore is Azure SQL, and
# swiftbets-secrets is written by Terraform with Azure SQL connection strings (Encrypt=True).
global:
  # :main moves on every merge; deploys restart pods so each pulls what the tag points at now.
  imagePullPolicy: Always
  env:
    ASPNETCORE_ENVIRONMENT: Production
infra:
  sqlserver:
    enabled: false
ingress:
  enabled: true
  className: traefik
  host: ""   # set with --set ingress.host=<your host>
gateway:
  autoscaling: { enabled: false }
  pdb: { enabled: false }
