# Any local cluster (kind, k3d, k3s, Docker Desktop): everything in-cluster, including SQL Server, with demo secrets.
global:
  env:
    ASPNETCORE_ENVIRONMENT: Development
localSecrets:
  enabled: true
  demoPassword: Local-Dev-Demo-1
  sqlServerSaPassword: Local-Dev-Sa-Pass-1
  postgresPassword: local-dev-postgres
  dbPasswords:
    placement: Local-Dev-Placement-1
    wallet: Local-Dev-Wallet-1
    settlement: Local-Dev-Settlement-1
    payout: Local-Dev-Payout-1
    identity: Local-Dev-Identity-1
    compliance: Local-Dev-Compliance-1
    payments: Local-Dev-Payments-1
    casino: Local-Dev-Casino-1
    steward: local-dev-steward
    history: local-dev-history
    catalog: local-dev-catalog
    notifications: local-dev-notifications
    config: local-dev-config
  clientSecrets:
    payout: local-dev-payout-client-secret
    steward: local-dev-steward-client-secret
    payments: local-dev-payments-client-secret
    placement: local-dev-placement-client-secret
    cashout: local-dev-cashout-client-secret
    history: local-dev-history-client-secret
    casino: local-dev-casino-client-secret
  casinoSimSeamlessSecret: local-dev-sim-seamless-secret-0123456789abcdef
  casinoSimTransferSecret: local-dev-sim-transfer-secret-0123456789abcdef
  # Base64 of 32 bytes; signs cashout quotes. Local only - prod's comes from Terraform.
  cashoutSigningKey: bG9jYWwtZGV2LWNhc2hvdXQtcXVvdGUtc2lnbmluZy1r
  paymentsSimulatorApiKey: local-dev-simulator-key
  paymentsWebhookSecret: local-dev-simulator-webhook-secret
infra:
  sqlserver:
    enabled: true
  mailpit:
    enabled: true
config:
  resources: { requests: { cpu: 20m } }
bethistory:
  resources: { requests: { cpu: 20m } }
notifications:
  resources: { requests: { cpu: 20m } }
  env:
    Email__SmtpHost: mailpit
    Email__SmtpPort: "1025"
settlement:
  resources: { requests: { cpu: 20m } }
  env: { FaultInjection__Enabled: "true" }
payout:
  resources: { requests: { cpu: 20m } }
  env: { FaultInjection__Enabled: "true" }
wallet:
  resources: { requests: { cpu: 20m } }
  env: { FaultInjection__Enabled: "true" }
# Local clusters are load-tested (k6 signs in 100 users); production keeps the gateway's strict defaults.
gateway:
  resources: { requests: { cpu: 20m } }
  env:
    Gateway__RateLimits__LoginPerMinute: "600"
    Gateway__RateLimits__PlacementsPerUserPerMinute: "20000"
    Gateway__RateLimits__RequestsPerIpPerMinute: "200000"

# One kind node runs the whole platform, so services ask for a sliver of CPU and burst as needed.
offer:
  resources: { requests: { cpu: 20m } }
placement:
  resources: { requests: { cpu: 20m } }
identity:
  resources: { requests: { cpu: 20m } }
compliance:
  resources: { requests: { cpu: 20m } }
payments:
  resources: { requests: { cpu: 20m } }
payments-simulator:
  resources: { requests: { cpu: 20m } }
steward:
  resources: { requests: { cpu: 20m } }
realtime:
  resources: { requests: { cpu: 20m } }
risk:
  resources: { requests: { cpu: 20m } }
site:
  resources: { requests: { cpu: 20m } }
  env:
    CHECKOUT_ORIGINS: http://127.0.0.1:7140
dashboard:
  resources: { requests: { cpu: 20m } }
