{{- if .Values.localSecrets.enabled }}
{{- $s := .Values.localSecrets -}}
{{- /* Keep the signing key across upgrades: a new key would sign everyone out. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.global.secretName -}}
{{- $signingKey := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "identity-signing-key") -}}
{{- $signingKey = index $existing.data "identity-signing-key" | b64dec -}}
{{- else -}}
{{- $signingKey = genPrivateKey "rsa" -}}
{{- end -}}
{{- $sql := "Server=sqlserver,1433;Database=%s;User Id=%s;Password=%s;TrustServerCertificate=True;Encrypt=True" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretName }}
  labels:
    app.kubernetes.io/part-of: swiftbets
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  demo-password: {{ $s.demoPassword | quote }}
  sqlserver-sa-password: {{ $s.sqlServerSaPassword | quote }}
  postgres-password: {{ $s.postgresPassword | quote }}
  {{- range $svc := list "placement" "wallet" "settlement" "payout" "identity" "compliance" "payments" "steward" "history" "notifications" "config" "catalog" "casino" }}
  {{ $svc }}-db-password: {{ get $s.dbPasswords $svc | quote }}
  {{- end }}
  {{- range $svc, $db := dict "placement" "SbPlacement" "wallet" "SbWallet" "settlement" "SbSettlement" "payout" "SbPayout" "identity" "SbIdentity" "compliance" "SbCompliance" "payments" "SbPayments" "casino" "SbCasino" }}
  sb-{{ $svc }}: {{ printf $sql $db (printf "%s_app" $svc) (get $s.dbPasswords $svc) | quote }}
  sb-{{ $svc }}-migrate: {{ printf $sql $db "sa" $s.sqlServerSaPassword | quote }}
  {{- end }}
  sb-steward: {{ printf "Host=postgres;Database=sb_steward;Username=steward_app;Password=%s" $s.dbPasswords.steward | quote }}
  sb-history: {{ printf "Host=postgres;Database=sb_history;Username=history_app;Password=%s" $s.dbPasswords.history | quote }}
  sb-notifications: {{ printf "Host=postgres;Database=sb_notifications;Username=notifications_app;Password=%s" $s.dbPasswords.notifications | quote }}
  sb-config: {{ printf "Host=postgres;Database=sb_config;Username=config_app;Password=%s" $s.dbPasswords.config | quote }}
  sb-catalog: {{ printf "Host=postgres;Database=sb_catalog;Username=catalog_app;Password=%s" $s.dbPasswords.catalog | quote }}
  sb-casino-catalog: {{ printf "Host=postgres;Database=sb_casino;Username=casino_catalog_app;Password=%s" (get $s.dbPasswords "casino-catalog") | quote }}
  casino-catalog-db-password: {{ get $s.dbPasswords "casino-catalog" | quote }}
  sb-risk: {{ printf "Host=postgres;Database=sb_risk;Username=risk_app;Password=%s" $s.dbPasswords.risk | quote }}
  risk-db-password: {{ $s.dbPasswords.risk | quote }}
  payout-client-secret: {{ $s.clientSecrets.payout | quote }}
  steward-client-secret: {{ $s.clientSecrets.steward | quote }}
  payments-client-secret: {{ $s.clientSecrets.payments | quote }}
  placement-client-secret: {{ $s.clientSecrets.placement | quote }}
  cashout-client-secret: {{ $s.clientSecrets.cashout | quote }}
  casino-client-secret: {{ $s.clientSecrets.casino | quote }}
  casino-sim-seamless-secret: {{ $s.casinoSimSeamlessSecret | quote }}
  casino-sim-transfer-secret: {{ $s.casinoSimTransferSecret | quote }}
  history-client-secret: {{ $s.clientSecrets.history | quote }}
  cashout-signing-key: {{ $s.cashoutSigningKey | quote }}
  payments-simulator-api-key: {{ $s.paymentsSimulatorApiKey | quote }}
  payments-webhook-secret: {{ $s.paymentsWebhookSecret | quote }}
  identity-signing-key: |
{{ $signingKey | indent 4 }}
{{- end }}
