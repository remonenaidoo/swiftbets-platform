{{- if .Values.ingress.enabled }}
# Only the gateway is public; it serves the dashboard, the API and the realtime hub on one origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftbets
  labels:
    app.kubernetes.io/part-of: swiftbets
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 8080 } }
{{- end }}
